# Lint, types, the frontend's tests and the backend's tests against a real Postgres.
#
# The service tests need a database: a disposable postgres:17-alpine service
# container (the image docker-compose.postgres.yml runs locally), migrated with
# the backend's own `db:migrate` before the suite runs. Nothing here is a
# secret. No path filter: a required check must report on every pull request.
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Lint, types and tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: stash
          POSTGRES_PASSWORD: stash
          POSTGRES_DB: stash_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U stash -d stash_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      CI: '1'
      DATABASE_URL: postgres://stash:stash@127.0.0.1:5432/stash_test
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      # The installed binary by path: a bare `bunx biome` that misses the local
      # install fetches npm's unrelated `biome` package, which lints nothing.
      - run: ./node_modules/.bin/biome ci .
      - run: bun run typecheck
      - name: Run the frontend tests
        working-directory: packages/frontend
        run: bun run test
      - name: Apply the migrations
        working-directory: packages/backend
        run: bun run db:migrate --target-database=stash_test
      - name: Run the backend tests
        working-directory: packages/backend
        run: bun run test
